<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6b7280"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2563eb"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16a34a"/></marker>
  </defs>

  <rect width="960" height="460" rx="16" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111">실시간 채팅 (SSE) 아키텍처</text>

  <!-- Customer -->
  <rect x="30" y="56" width="280" height="390" rx="12" fill="#fef2f2" fill-opacity="0.4" stroke="#fca5a5" stroke-width="1"/>
  <text x="170" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">🖥️ 고객 태블릿</text>
  <text x="170" y="92" text-anchor="middle" font-size="9" fill="#b91c1c">/chat — ChatClient.tsx</text>

  <!-- Server -->
  <rect x="340" y="56" width="280" height="390" rx="12" fill="#f0fdf4" fill-opacity="0.4" stroke="#86efac" stroke-width="1"/>
  <text x="480" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">⚙️ 서버 (API Route)</text>
  <text x="480" y="92" text-anchor="middle" font-size="9" fill="#059669">/api/chat · /api/chat/stream</text>

  <!-- Admin -->
  <rect x="650" y="56" width="280" height="390" rx="12" fill="#eff6ff" fill-opacity="0.4" stroke="#93c5fd" stroke-width="1"/>
  <text x="790" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">🏪 매장 관리자</text>
  <text x="790" y="92" text-anchor="middle" font-size="9" fill="#3b82f6">/admin/store/chat</text>

  <!-- SSE Connection -->
  <g filter="url(#s)">
    <rect x="50" y="108" width="240" height="36" rx="6" fill="#fff"/>
    <text x="170" y="131" text-anchor="middle" font-size="10" fill="#374151"><tspan font-weight="600">SSE 연결</tspan>: new EventSource()</text>
  </g>
  <line x1="290" y1="126" x2="350" y2="126" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <g filter="url(#s)">
    <rect x="350" y="108" width="250" height="36" rx="6" fill="#d1fae5"/>
    <text x="475" y="126" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">ReadableStream 생성</text>
    <text x="475" y="138" text-anchor="middle" font-size="8" fill="#059669">?storeId=1&amp;tableNo=31 (고객)</text>
  </g>
  <line x1="600" y1="126" x2="660" y2="126" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2"/>
  <g filter="url(#s)">
    <rect x="660" y="108" width="250" height="36" rx="6" fill="#fff"/>
    <text x="785" y="126" text-anchor="middle" font-size="10" fill="#374151"><tspan font-weight="600">SSE 연결</tspan>: ?storeId=1 (전체)</text>
    <text x="785" y="138" text-anchor="middle" font-size="8" fill="#9ca3af">tableNo 없음 → 관리자 모드</text>
  </g>

  <!-- Polling loop -->
  <g filter="url(#s)">
    <rect x="360" y="160" width="240" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="480" y="180" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">🔄 1.5초 폴링 루프</text>
    <text x="480" y="196" text-anchor="middle" font-size="9" fill="#a16207">SELECT * FROM chat_messages</text>
    <text x="480" y="210" text-anchor="middle" font-size="9" fill="#a16207">WHERE id &gt; lastId AND storeId = ?</text>
    <text x="480" y="224" text-anchor="middle" font-size="9" fill="#a16207">+ 30초마다 heartbeat</text>
  </g>

  <!-- SSE events -->
  <line x1="360" y1="195" x2="290" y2="195" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)" stroke-dasharray="5,3"/>
  <text x="325" y="190" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">event: messages</text>

  <line x1="600" y1="195" x2="660" y2="195" stroke="#16a34a" stroke-width="1.5" marker-end="url(#ag)" stroke-dasharray="5,3"/>
  <text x="630" y="190" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="600">messages + threads</text>

  <!-- Message send flow (Customer) -->
  <g filter="url(#s)">
    <rect x="50" y="254" width="240" height="60" rx="6" fill="#fff"/>
    <text x="170" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#374151">메시지 전송 (낙관적 업데이트)</text>
    <text x="170" y="290" text-anchor="middle" font-size="9" fill="#6b7280">1. 즉시 화면에 표시 (tempId)</text>
    <text x="170" y="302" text-anchor="middle" font-size="9" fill="#6b7280">2. POST /api/chat 호출</text>
  </g>
  <line x1="290" y1="284" x2="350" y2="284" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="320" y="278" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">POST</text>

  <g filter="url(#s)">
    <rect x="350" y="254" width="250" height="60" rx="6" fill="#fff"/>
    <text x="475" y="274" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">POST /api/chat</text>
    <text x="475" y="290" text-anchor="middle" font-size="9" fill="#6b7280">DB에 ChatMessage 저장</text>
    <text x="475" y="302" text-anchor="middle" font-size="9" fill="#6b7280">→ 다음 폴링 시 SSE로 전파</text>
  </g>

  <line x1="350" y1="298" x2="290" y2="298" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="320" y="310" text-anchor="middle" font-size="8" fill="#16a34a">실제 ID 반환 → tempId 교체</text>

  <!-- Admin thread summary -->
  <g filter="url(#s)">
    <rect x="660" y="254" width="250" height="76" rx="6" fill="#dbeafe"/>
    <text x="785" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">관리자 전용: 스레드 요약</text>
    <text x="785" y="292" text-anchor="middle" font-size="9" fill="#3b82f6">Raw SQL 서브쿼리:</text>
    <text x="785" y="306" text-anchor="middle" font-size="8" fill="#60a5fa">{ tableNo, lastMessage, unread }</text>
    <text x="785" y="320" text-anchor="middle" font-size="8" fill="#60a5fa">미읽 수 → 사이드바 뱃지 표시</text>
  </g>

  <!-- Quick buttons -->
  <g filter="url(#s)">
    <rect x="50" y="330" width="240" height="48" rx="6" fill="#f5f3ff"/>
    <text x="170" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">빠른 질문 버튼</text>
    <text x="170" y="366" text-anchor="middle" font-size="8" fill="#7c3aed">[이용 시간] [와이파이 비밀번호] [화장실 위치]</text>
  </g>

  <!-- Why SSE box -->
  <g filter="url(#s)">
    <rect x="50" y="392" width="860" height="46" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="480" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#854d0e">💡 왜 WebSocket 대신 SSE인가?</text>
    <text x="480" y="428" text-anchor="middle" font-size="9" fill="#a16207">전송(POST) + 수신(SSE) 분리 → 단방향 스트리밍이면 SSE 충분 · Next.js Route Handler만으로 구현 · Vercel 서버리스 호환 · EventSource 자동 재연결 내장</text>
  </g>

  <!-- Admin reply -->
  <g filter="url(#s)">
    <rect x="660" y="344" width="250" height="36" rx="6" fill="#fff"/>
    <text x="785" y="366" text-anchor="middle" font-size="10" fill="#374151"><tspan font-weight="600">관리자 답장</tspan>: POST (sender: STORE)</text>
  </g>
  <line x1="660" y1="362" x2="600" y2="290" stroke="#dc2626" stroke-width="1.2" marker-end="url(#ar)" stroke-dasharray="4,2"/>
</svg>