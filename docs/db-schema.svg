<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="#fafafa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111">DB 스키마 관계도 (23 모델)</text>

  <!-- Legend -->
  <g font-size="9" fill="#6b7280">
    <line x1="700" y1="24" x2="740" y2="24" stroke="#374151" stroke-width="1.5"/>
    <text x="745" y="28">1:N 관계</text>
    <line x1="820" y1="24" x2="860" y2="24" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="865" y="28">N:M (via 중간테이블)</text>
  </g>

  <!-- ===== Group 1: Auth & Store ===== -->
  <rect x="20" y="50" width="225" height="190" rx="10" fill="#fef3c7" fill-opacity="0.4" stroke="#fde68a" stroke-width="1"/>
  <text x="132" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">인증 / 매장</text>

  <g filter="url(#s)">
    <rect x="35" y="78" width="100" height="60" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="35" y="78" width="100" height="20" rx="6" fill="#fef3c7"/>
    <text x="85" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Store</text>
    <text x="45" y="113" font-size="8" fill="#6b7280">id, name, storeCode</text>
    <text x="45" y="125" font-size="8" fill="#6b7280">address, isActive</text>
  </g>

  <g filter="url(#s)">
    <rect x="35" y="155" width="100" height="50" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="35" y="155" width="100" height="20" rx="6" fill="#fef3c7"/>
    <text x="85" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">AdminUser</text>
    <text x="45" y="190" font-size="8" fill="#6b7280">loginId, password</text>
    <text x="45" y="200" font-size="8" fill="#6b7280">role, storeId</text>
  </g>
  <line x1="85" y1="138" x2="85" y2="155" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="150" y="78" width="85" height="60" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="150" y="78" width="85" height="20" rx="6" fill="#fef3c7"/>
    <text x="192" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Table</text>
    <text x="158" y="113" font-size="8" fill="#6b7280">tableNo, setupCode</text>
    <text x="158" y="125" font-size="8" fill="#6b7280">storeId</text>
  </g>
  <line x1="135" y1="108" x2="150" y2="108" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="150" y="155" width="85" height="50" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="150" y="155" width="85" height="20" rx="6" fill="#fef3c7"/>
    <text x="192" y="170" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">TableSession</text>
    <text x="158" y="190" font-size="8" fill="#6b7280">checkInAt</text>
    <text x="158" y="200" font-size="8" fill="#6b7280">checkOutAt</text>
  </g>
  <line x1="192" y1="138" x2="192" y2="155" stroke="#374151" stroke-width="1"/>

  <!-- ===== Group 2: Game ===== -->
  <rect x="260" y="50" width="260" height="190" rx="10" fill="#d1fae5" fill-opacity="0.3" stroke="#a7f3d0" stroke-width="1"/>
  <text x="390" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">게임 / 추천</text>

  <g filter="url(#s)">
    <rect x="275" y="78" width="105" height="70" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="275" y="78" width="105" height="20" rx="6" fill="#d1fae5"/>
    <text x="327" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Game</text>
    <text x="283" y="113" font-size="8" fill="#6b7280">title, description</text>
    <text x="283" y="125" font-size="8" fill="#6b7280">difficulty, playTime</text>
    <text x="283" y="137" font-size="8" fill="#6b7280">minPlayers, maxPlayers</text>
  </g>

  <g filter="url(#s)">
    <rect x="395" y="78" width="55" height="40" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="395" y="78" width="55" height="20" rx="6" fill="#d1fae5"/>
    <text x="422" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">Tag</text>
    <text x="401" y="113" font-size="8" fill="#6b7280">group, value</text>
  </g>

  <g filter="url(#s)">
    <rect x="460" y="78" width="50" height="40" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="460" y="78" width="50" height="18" rx="6" fill="#ecfdf5"/>
    <text x="485" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">GameTag</text>
    <text x="466" y="110" font-size="7" fill="#6b7280">M:N 중간</text>
  </g>
  <line x1="380" y1="98" x2="395" y2="98" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="450" y1="98" x2="460" y2="98" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>

  <g filter="url(#s)">
    <rect x="275" y="160" width="80" height="36" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="275" y="160" width="80" height="18" rx="6" fill="#ecfdf5"/>
    <text x="315" y="174" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">GameHashtag</text>
    <text x="283" y="190" font-size="7" fill="#6b7280">text, order</text>
  </g>
  <line x1="327" y1="148" x2="315" y2="160" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="370" y="135" width="80" height="36" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="370" y="135" width="80" height="18" rx="6" fill="#ecfdf5"/>
    <text x="410" y="149" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">StoreGame</text>
    <text x="378" y="165" font-size="7" fill="#6b7280">isVisible, shelf</text>
  </g>
  <line x1="356" y1="135" x2="370" y2="148" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="370" y="185" width="140" height="46" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="370" y="185" width="140" height="18" rx="6" fill="#ecfdf5"/>
    <text x="440" y="199" text-anchor="middle" font-size="8" font-weight="700" fill="#065f46">RecommendCategory</text>
    <text x="378" y="215" font-size="7" fill="#6b7280">title, subtitle, emoji</text>
    <text x="378" y="225" font-size="7" fill="#6b7280">→ RecommendCategoryItem</text>
  </g>

  <!-- ===== Group 3: Menu & Order ===== -->
  <rect x="535" y="50" width="200" height="280" rx="10" fill="#dbeafe" fill-opacity="0.3" stroke="#93c5fd" stroke-width="1"/>
  <text x="635" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">메뉴 / 주문</text>

  <g filter="url(#s)">
    <rect x="550" y="78" width="90" height="56" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="550" y="78" width="90" height="20" rx="6" fill="#dbeafe"/>
    <text x="595" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Menu</text>
    <text x="558" y="113" font-size="8" fill="#6b7280">name, basePrice</text>
    <text x="558" y="125" font-size="8" fill="#6b7280">isNew, isBest</text>
  </g>

  <g filter="url(#s)">
    <rect x="650" y="78" width="75" height="40" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="650" y="78" width="75" height="18" rx="6" fill="#eff6ff"/>
    <text x="687" y="92" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">Category</text>
    <text x="658" y="110" font-size="7" fill="#6b7280">name, order</text>
  </g>
  <line x1="640" y1="98" x2="650" y2="93" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="550" y="148" width="90" height="40" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="550" y="148" width="90" height="18" rx="6" fill="#eff6ff"/>
    <text x="595" y="162" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">MenuOptGroup</text>
    <text x="558" y="180" font-size="7" fill="#6b7280">name, isRequired</text>
  </g>
  <line x1="595" y1="134" x2="595" y2="148" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="650" y="148" width="75" height="40" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="650" y="148" width="75" height="18" rx="6" fill="#eff6ff"/>
    <text x="687" y="162" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">MenuOption</text>
    <text x="658" y="180" font-size="7" fill="#6b7280">name, extraPrice</text>
  </g>
  <line x1="640" y1="168" x2="650" y2="168" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="650" y="124" width="75" height="18" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="687" y="136" text-anchor="middle" font-size="8" font-weight="700" fill="#1e40af">StoreMenu</text>
  </g>

  <!-- Order chain -->
  <g filter="url(#s)">
    <rect x="550" y="204" width="90" height="56" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="550" y="204" width="90" height="20" rx="6" fill="#fecaca"/>
    <text x="595" y="219" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Order</text>
    <text x="558" y="237" font-size="8" fill="#6b7280">totalPrice, status</text>
    <text x="558" y="249" font-size="8" fill="#6b7280">paymentMethod</text>
  </g>

  <g filter="url(#s)">
    <rect x="550" y="272" width="90" height="44" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="550" y="272" width="90" height="18" rx="6" fill="#fee2e2"/>
    <text x="595" y="286" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">OrderItem</text>
    <text x="558" y="302" font-size="7" fill="#dc2626">★ menuName 스냅샷</text>
    <text x="558" y="312" font-size="7" fill="#dc2626">★ basePrice 스냅샷</text>
  </g>
  <line x1="595" y1="260" x2="595" y2="272" stroke="#374151" stroke-width="1"/>

  <g filter="url(#s)">
    <rect x="650" y="272" width="75" height="44" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="650" y="272" width="75" height="18" rx="6" fill="#fee2e2"/>
    <text x="687" y="286" text-anchor="middle" font-size="7" font-weight="700" fill="#991b1b">OrderItemOpt</text>
    <text x="656" y="302" font-size="7" fill="#dc2626">★ optionName</text>
    <text x="656" y="312" font-size="7" fill="#dc2626">★ extraPrice</text>
  </g>
  <line x1="640" y1="294" x2="650" y2="294" stroke="#374151" stroke-width="1"/>

  <!-- ===== Group 4: Communication ===== -->
  <rect x="750" y="50" width="190" height="280" rx="10" fill="#fef3c7" fill-opacity="0.3" stroke="#fde68a" stroke-width="1"/>
  <text x="845" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">커뮤니케이션 / 기타</text>

  <g filter="url(#s)">
    <rect x="765" y="82" width="160" height="44" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="765" y="82" width="160" height="18" rx="6" fill="#fef3c7"/>
    <text x="845" y="96" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">ChatMessage</text>
    <text x="773" y="114" font-size="8" fill="#6b7280">storeId, tableNo, sender, text</text>
  </g>

  <g filter="url(#s)">
    <rect x="765" y="138" width="75" height="30" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="765" y="138" width="75" height="16" rx="6" fill="#fef3c7"/>
    <text x="802" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Event</text>
    <text x="773" y="163" font-size="7" fill="#6b7280">title, imageUrl</text>
  </g>

  <g filter="url(#s)">
    <rect x="850" y="138" width="75" height="30" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="850" y="138" width="75" height="16" rx="6" fill="#fef3c7"/>
    <text x="887" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Feedback</text>
    <text x="858" y="163" font-size="7" fill="#6b7280">content, storeId</text>
  </g>

  <g filter="url(#s)">
    <rect x="765" y="180" width="75" height="30" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="765" y="180" width="75" height="16" rx="6" fill="#fef3c7"/>
    <text x="802" y="192" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">Coupon</text>
    <text x="773" y="206" font-size="7" fill="#6b7280">code, discount</text>
  </g>

  <g filter="url(#s)">
    <rect x="850" y="180" width="80" height="30" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="850" y="180" width="80" height="16" rx="6" fill="#fef3c7"/>
    <text x="890" y="192" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">CouponUsage</text>
    <text x="858" y="206" font-size="7" fill="#6b7280">tableId, usedAt</text>
  </g>
  <line x1="840" y1="195" x2="850" y2="195" stroke="#374151" stroke-width="1"/>

  <!-- Key patterns at bottom -->
  <rect x="20" y="350" width="920" height="160" rx="10" fill="#f5f3ff" fill-opacity="0.5" stroke="#c4b5fd" stroke-width="1"/>
  <text x="480" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">핵심 DB 설계 패턴</text>

  <!-- Pattern 1 -->
  <g filter="url(#s)">
    <rect x="40" y="386" width="280" height="110" rx="8" fill="#fff"/>
    <text x="180" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">본사-매장 오버라이드</text>
    <text x="52" y="424" font-size="9" fill="#6b7280">Game (본사 마스터)</text>
    <line x1="52" y1="430" x2="190" y2="430" stroke="#c4b5fd" stroke-width="1"/>
    <text x="200" y="437" font-size="9" fill="#6b7280">→ StoreGame (매장별 노출/위치)</text>
    <text x="52" y="452" font-size="9" fill="#6b7280">Menu (본사 가격)</text>
    <line x1="52" y1="458" x2="190" y2="458" stroke="#c4b5fd" stroke-width="1"/>
    <text x="200" y="465" font-size="9" fill="#6b7280">→ StoreMenu (매장별 가격/품절)</text>
    <text x="52" y="484" font-size="8" fill="#7c3aed">LEFT JOIN으로 병합, 없으면 본사 기본값</text>
  </g>

  <!-- Pattern 2 -->
  <g filter="url(#s)">
    <rect x="340" y="386" width="280" height="110" rx="8" fill="#fff"/>
    <text x="480" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">주문 스냅샷 패턴</text>
    <text x="352" y="424" font-size="9" fill="#6b7280">OrderItem에 menuName, basePrice 복사 저장</text>
    <text x="352" y="442" font-size="9" fill="#6b7280">OrderItemOption에 optionName, extraPrice 복사</text>
    <line x1="352" y1="450" x2="600" y2="450" stroke="#c4b5fd" stroke-width="1"/>
    <text x="352" y="468" font-size="9" fill="#dc2626" font-weight="600">→ 메뉴명/가격 변경해도 과거 주문은 불변</text>
    <text x="352" y="486" font-size="8" fill="#7c3aed">prisma.$transaction()으로 원자적 처리</text>
  </g>

  <!-- Pattern 3 -->
  <g filter="url(#s)">
    <rect x="640" y="386" width="280" height="110" rx="8" fill="#fff"/>
    <text x="780" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">태그 시스템 (M:N)</text>
    <text x="652" y="424" font-size="9" fill="#6b7280">Game ↔ GameTag ↔ Tag</text>
    <text x="652" y="442" font-size="9" fill="#6b7280">Tag.group: "genre", "player_count"</text>
    <line x1="652" y1="450" x2="900" y2="450" stroke="#c4b5fd" stroke-width="1"/>
    <text x="652" y="468" font-size="9" fill="#6b7280">같은 group = OR 필터</text>
    <text x="652" y="484" font-size="9" fill="#6b7280">다른 group = AND 필터 (Prisma where.AND)</text>
  </g>
</svg>