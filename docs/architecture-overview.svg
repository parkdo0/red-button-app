<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gdb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" rx="16" fill="#fafafa"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111">레드버튼 시스템 아키텍처</text>

  <!-- Next.js App boundary -->
  <rect x="30" y="52" width="900" height="616" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="72" font-size="11" fill="#9ca3af" font-weight="600">Next.js 15 Single Application</text>

  <!-- 3 User Types -->
  <g filter="url(#shadow)">
    <rect x="60" y="88" width="240" height="80" rx="10" fill="url(#g1)"/>
    <text x="180" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">🖥️ 고객 태블릿 (Pad)</text>
    <text x="180" y="135" text-anchor="middle" font-size="11" fill="#b91c1c">/, /search, /order, /chat</text>
    <text x="180" y="152" text-anchor="middle" font-size="10" fill="#dc2626">세션: TABLE (매장코드+설정코드)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="360" y="88" width="240" height="80" rx="10" fill="url(#g2)"/>
    <text x="480" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">🏪 매장 관리자</text>
    <text x="480" y="135" text-anchor="middle" font-size="11" fill="#2563eb">/admin/store/*</text>
    <text x="480" y="152" text-anchor="middle" font-size="10" fill="#3b82f6">세션: STORE_ADMIN (ID/PW)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="88" width="240" height="80" rx="10" fill="url(#g3)"/>
    <text x="780" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">🏢 본사 관리자</text>
    <text x="780" y="135" text-anchor="middle" font-size="11" fill="#059669">/admin/hq/*</text>
    <text x="780" y="152" text-anchor="middle" font-size="10" fill="#10b981">세션: HQ_ADMIN (ID/PW)</text>
  </g>

  <!-- Arrows down -->
  <line x1="180" y1="168" x2="180" y2="196" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="168" x2="480" y2="196" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="780" y1="168" x2="780" y2="196" stroke="#9ca3af" stroke-width="1.5"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9ca3af"/></marker></defs>

  <!-- Middleware -->
  <g filter="url(#shadow)">
    <rect x="60" y="196" width="840" height="52" rx="10" fill="url(#g4)"/>
    <text x="480" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">🔒 Middleware (Edge Runtime)</text>
    <text x="480" y="236" text-anchor="middle" font-size="11" fill="#a16207">JWT 검증 → 역할 기반 라우트 보호 → jose.jwtVerify() → httpOnly Cookie</text>
  </g>

  <!-- Arrow down from middleware -->
  <line x1="480" y1="248" x2="480" y2="270" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Two Data Patterns -->
  <g filter="url(#shadow)">
    <rect x="60" y="270" width="400" height="140" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="60" y="270" width="400" height="32" rx="10" fill="#f0fdf4"/>
    <rect x="60" y="290" width="400" height="12" fill="#f0fdf4"/>
    <text x="260" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">패턴 A: Server Component 직접 DB 조회</text>

    <text x="80" y="325" font-size="11" fill="#374151">page.tsx</text>
    <text x="155" y="325" font-size="11" fill="#9ca3af">→</text>
    <rect x="170" y="312" width="90" height="22" rx="5" fill="#dcfce7"/>
    <text x="215" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">queries.ts</text>
    <text x="275" y="325" font-size="11" fill="#9ca3af">→</text>
    <rect x="290" y="312" width="70" height="22" rx="5" fill="#dcfce7"/>
    <text x="325" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Prisma</text>
    <text x="375" y="325" font-size="11" fill="#9ca3af">→</text>
    <text x="400" y="325" font-size="11" font-weight="600" fill="#166534">MySQL</text>

    <text x="80" y="356" font-size="10" fill="#6b7280">사용: 홈, 검색, 주문, 채팅, 이벤트, 이용정보</text>
    <text x="80" y="374" font-size="10" fill="#6b7280">장점: API 왕복 없음, 번들 사이즈 작음, 초기 로딩 빠름</text>
    <text x="80" y="392" font-size="10" fill="#6b7280">흐름: requireTableSession() → DB 조회 → Client에 props 전달</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="270" width="400" height="140" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="500" y="270" width="400" height="32" rx="10" fill="#eff6ff"/>
    <rect x="500" y="290" width="400" height="12" fill="#eff6ff"/>
    <text x="700" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">패턴 B: Client → API Route</text>

    <text x="520" y="325" font-size="11" fill="#374151">Client</text>
    <text x="575" y="325" font-size="11" fill="#9ca3af">→</text>
    <rect x="590" y="312" width="60" height="22" rx="5" fill="#dbeafe"/>
    <text x="620" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">api.ts</text>
    <text x="665" y="325" font-size="11" fill="#9ca3af">→</text>
    <rect x="680" y="312" width="80" height="22" rx="5" fill="#dbeafe"/>
    <text x="720" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">API Route</text>
    <text x="775" y="325" font-size="11" fill="#9ca3af">→</text>
    <text x="810" y="325" font-size="11" font-weight="600" fill="#1e40af">MySQL</text>

    <text x="520" y="356" font-size="10" fill="#6b7280">사용: 주문 생성, 채팅 전송, 상태 변경, CRUD</text>
    <text x="520" y="374" font-size="10" fill="#6b7280">장점: 사용자 인터랙션 처리, 세션 검증</text>
    <text x="520" y="392" font-size="10" fill="#6b7280">흐름: api.ts → axios → /api/* → getApiSession() → Prisma</text>
  </g>

  <!-- Provider Layer -->
  <g filter="url(#shadow)">
    <rect x="60" y="430" width="840" height="80" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="480" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">루트 레이아웃 Provider 계층 (layout.tsx)</text>
    <g>
      <rect x="100" y="465" width="140" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="170" y="484" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">SessionProvider</text>
    </g>
    <text x="250" y="484" font-size="11" fill="#9ca3af">→</text>
    <g>
      <rect x="265" y="465" width="120" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="325" y="484" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">ToastProvider</text>
    </g>
    <text x="395" y="484" font-size="11" fill="#9ca3af">→</text>
    <g>
      <rect x="410" y="465" width="120" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="470" y="484" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">CartProvider</text>
    </g>
    <text x="540" y="484" font-size="11" fill="#9ca3af">→</text>
    <g>
      <rect x="555" y="465" width="110" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
      <text x="610" y="484" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Navigation</text>
    </g>
    <text x="675" y="484" font-size="11" fill="#9ca3af">+</text>
    <g>
      <rect x="690" y="465" width="180" height="28" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
      <text x="780" y="484" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">main (children)</text>
    </g>
  </g>

  <!-- Database Layer -->
  <g filter="url(#shadow)">
    <rect x="60" y="530" width="840" height="126" rx="10" fill="url(#gdb)"/>
    <text x="480" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">MySQL 8 — Prisma ORM (23 모델)</text>

    <!-- Core tables grouped -->
    <g font-size="9.5" fill="#4338ca">
      <rect x="80" y="566" width="170" height="76" rx="6" fill="#fff" fill-opacity="0.7"/>
      <text x="165" y="582" text-anchor="middle" font-weight="700" fill="#3730a3">사용자/인증</text>
      <text x="90" y="598">AdminUser · Store · Table</text>
      <text x="90" y="612">TableSession</text>

      <rect x="270" y="566" width="170" height="76" rx="6" fill="#fff" fill-opacity="0.7"/>
      <text x="355" y="582" text-anchor="middle" font-weight="700" fill="#3730a3">게임</text>
      <text x="280" y="598">Game · Tag · GameTag</text>
      <text x="280" y="612">GameHashtag · StoreGame</text>
      <text x="280" y="626">RecommendCategory</text>

      <rect x="460" y="566" width="170" height="76" rx="6" fill="#fff" fill-opacity="0.7"/>
      <text x="545" y="582" text-anchor="middle" font-weight="700" fill="#3730a3">메뉴/주문</text>
      <text x="470" y="598">Menu · Category · StoreMenu</text>
      <text x="470" y="612">Order · OrderItem</text>
      <text x="470" y="626">OrderItemOption</text>

      <rect x="650" y="566" width="230" height="76" rx="6" fill="#fff" fill-opacity="0.7"/>
      <text x="765" y="582" text-anchor="middle" font-weight="700" fill="#3730a3">커뮤니케이션/기타</text>
      <text x="660" y="598">ChatMessage · Event · Feedback</text>
      <text x="660" y="612">Coupon · CouponUsage</text>
      <text x="660" y="626">MenuOptionGroup · MenuOption</text>
    </g>
  </g>
</svg>