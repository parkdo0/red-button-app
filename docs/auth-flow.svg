<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#6b7280"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16a34a"/></marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111">인증 플로우</text>

  <!-- Login Page -->
  <g filter="url(#s)">
    <rect x="360" y="56" width="240" height="60" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="480" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">/login 통합 로그인 페이지</text>
    <text x="480" y="100" text-anchor="middle" font-size="10" fill="#b91c1c">[관리자 탭] · [테이블 탭]</text>
  </g>

  <!-- Branch -->
  <line x1="400" y1="116" x2="200" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="116" x2="760" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Admin Login Flow -->
  <g filter="url(#s)">
    <rect x="60" y="155" width="280" height="44" rx="8" fill="#dbeafe"/>
    <text x="200" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">① 관리자: 아이디 + 비밀번호 입력</text>
    <text x="200" y="190" text-anchor="middle" font-size="9" fill="#3b82f6">POST /api/auth/login { type: "admin" }</text>
  </g>
  <line x1="200" y1="199" x2="200" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="60" y="218" width="280" height="44" rx="8" fill="#dbeafe"/>
    <text x="200" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">② DB에서 AdminUser 조회</text>
    <text x="200" y="253" text-anchor="middle" font-size="9" fill="#3b82f6">bcrypt.compare(password, user.password)</text>
  </g>
  <line x1="200" y1="262" x2="200" y2="281" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="60" y="281" width="280" height="44" rx="8" fill="#dbeafe"/>
    <text x="200" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">③ 역할 결정: HQ_ADMIN / STORE_ADMIN</text>
    <text x="200" y="316" text-anchor="middle" font-size="9" fill="#3b82f6">AdminUser.role 기반 매핑</text>
  </g>

  <!-- Table Login Flow -->
  <g filter="url(#s)">
    <rect x="620" y="155" width="280" height="44" rx="8" fill="#d1fae5"/>
    <text x="760" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">① 매장 선택 + 4자리 설정코드 입력</text>
    <text x="760" y="190" text-anchor="middle" font-size="9" fill="#059669">POST /api/auth/login { type: "table" }</text>
  </g>
  <line x1="760" y1="199" x2="760" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="620" y="218" width="280" height="44" rx="8" fill="#d1fae5"/>
    <text x="760" y="238" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">② setupCode 조합: "SW" + "31AA"</text>
    <text x="760" y="253" text-anchor="middle" font-size="9" fill="#059669">매장접두사 + 입력코드 = "SW31AA"</text>
  </g>
  <line x1="760" y1="262" x2="760" y2="281" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="620" y="281" width="280" height="44" rx="8" fill="#d1fae5"/>
    <text x="760" y="301" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">③ DB에서 Table 조회 (storeId+code)</text>
    <text x="760" y="316" text-anchor="middle" font-size="9" fill="#059669">매장 오픈 시 직원이 1회 설정</text>
  </g>

  <!-- Merge -->
  <line x1="200" y1="325" x2="200" y2="360" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="760" y1="325" x2="760" y2="360" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="200" y1="360" x2="760" y2="360" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="480" y1="360" x2="480" y2="378" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- JWT Creation -->
  <g filter="url(#s)">
    <rect x="280" y="378" width="400" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="400" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">JWT 토큰 생성 (jose) → httpOnly Cookie 저장</text>
    <text x="480" y="416" text-anchor="middle" font-size="9" fill="#a16207">{ role, storeId, tableNo, tableId } · HS256 · 만료 16시간 · secure · sameSite: lax</text>
  </g>

  <!-- Redirect -->
  <line x1="480" y1="428" x2="480" y2="448" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Redirect targets -->
  <g filter="url(#s)">
    <rect x="60" y="448" width="200" height="36" rx="8" fill="#fee2e2"/>
    <text x="160" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">TABLE → / (고객 홈)</text>
  </g>
  <g filter="url(#s)">
    <rect x="300" y="448" width="200" height="36" rx="8" fill="#dbeafe"/>
    <text x="400" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">STORE → /admin/store</text>
  </g>
  <g filter="url(#s)">
    <rect x="540" y="448" width="200" height="36" rx="8" fill="#d1fae5"/>
    <text x="640" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">HQ → /admin/hq</text>
  </g>

  <!-- Middleware note -->
  <g filter="url(#s)">
    <rect x="770" y="448" width="170" height="56" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="855" y="468" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">이후 모든 요청:</text>
    <text x="855" y="482" text-anchor="middle" font-size="9" fill="#a16207">Middleware가 Cookie에서</text>
    <text x="855" y="496" text-anchor="middle" font-size="9" fill="#a16207">JWT 검증 → 역할 확인</text>
  </g>
</svg>